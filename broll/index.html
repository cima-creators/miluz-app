<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>B-roll + voz en off · Mi Luz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',-apple-system,BlinkMacSystemFont,sans-serif}
:root{--bg:#FAF7F4;--card:#FFFFFF;--soft:#F6F2EE;--line:#EFE8E3;--line2:#E2D8D1;--txt:#26211E;--mut:#8A7E77;--mut2:#B5A79F;
  --ok:#3F8F6B;--ok-bg:#E7F2EC;--warn:#B07B2E;--warn-bg:#F7EEDD;--bad:#C1613C;--bad-bg:#F8E7DF;--r:22px}
body{background:var(--bg);color:var(--txt);min-height:100vh;-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.5}
.wrap{max-width:1240px;margin:0 auto;padding:28px 22px 60px}
header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:22px}
h1{font-size:30px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.sub{color:var(--mut);font-size:13px;margin-top:6px}
.btn{background:var(--card);color:var(--txt);border:1px solid var(--line);padding:10px 17px;border-radius:14px;font-weight:600;font-size:13px;cursor:pointer;min-height:42px}
.btn:hover{border-color:var(--line2)}
.btn.dark{background:var(--txt);color:#fff;border-color:var(--txt)}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn.no{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:default}
.marcas{display:flex;gap:4px;background:var(--soft);border:1px solid var(--line);border-radius:16px;padding:4px;width:max-content;max-width:100%;overflow-x:auto;margin-bottom:18px}
.proceso{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:14px;font-size:13px}
.proceso b{margin-right:4px}.pp{padding:5px 10px;border-radius:99px;background:var(--soft);color:var(--txt);font-size:12px}
.pp.armando{background:#FFF3DF;color:#9A6512}.pp.error{background:#FDE8E6;color:#B3261E}
.origen-v{background:#FFF3DF;color:#7A4B0C;border:1px solid #F3D9A8;border-radius:12px;padding:8px 12px;font-size:12.5px;font-weight:600;margin:8px 0 2px}
.fila-sol{display:flex;gap:14px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}
.fila-sol .marcas{margin-bottom:0}
.especial{display:flex;align-items:center;gap:12px;border:0;cursor:pointer;text-align:left;padding:11px 20px 11px 14px;border-radius:16px;
  background:linear-gradient(135deg,#3a302b,#1f1a17);color:#fff;box-shadow:0 6px 18px rgba(38,33,30,.18);transition:transform .15s}
.especial:hover{transform:translateY(-1px)}
.especial .ico{display:grid;place-items:center;width:34px;height:34px;border-radius:11px;background:rgba(255,255,255,.12);font-size:17px}
.especial b{display:block;font-size:14px}.especial small{display:block;font-size:11.5px;color:rgba(255,255,255,.7);margin-top:2px}
.especial.on{outline:2px solid #C9A27E;outline-offset:3px}
@media(max-width:640px){.especial{width:100%}}
.mt{border:0;background:transparent;color:var(--mut);font-weight:600;font-size:13px;padding:8px 16px;border-radius:12px;cursor:pointer;white-space:nowrap}
.mt.on{background:var(--card);color:var(--txt);box-shadow:0 1px 4px rgba(38,33,30,.08)}
.mt b{display:inline-block;margin-left:7px;min-width:20px;padding:0 6px;border-radius:99px;background:var(--warn-bg);color:var(--warn);font-size:11px;font-weight:600}
.top{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,2fr);gap:11px;margin-bottom:18px}
@media (max-width:900px){.top{grid-template-columns:minmax(0,1fr)}}
.hero{border-radius:26px;padding:22px 24px;color:#fff;position:relative;overflow:hidden;background:linear-gradient(135deg,#51463F 0%,#26211E 64%);display:flex;align-items:center;gap:20px;min-height:200px}
.hero .blob{position:absolute;width:230px;height:230px;border-radius:50%;background:rgba(255,255,255,.06);right:-80px;bottom:-100px}
.ringbox{position:relative;width:112px;height:112px;flex-shrink:0}
.ringbox svg{transform:rotate(-90deg);display:block}
.ringbox .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ringbox .mid b{font-size:30px;font-weight:700;line-height:1;letter-spacing:-.03em}
.ringbox .mid u{text-decoration:none;font-size:10.5px;opacity:.75;margin-top:3px}
.hero-msg{position:relative;min-width:0}
.hero-msg .ey{font-size:10.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;opacity:.6}
.hero-msg h3{font-size:19px;font-weight:700;line-height:1.2;letter-spacing:-.025em;margin:6px 0 7px;color:#fff;text-transform:none}
.hero-msg p{font-size:12.5px;line-height:1.55;opacity:.85}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}
@media (max-width:600px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px 18px;min-height:94px;display:flex;flex-direction:column;cursor:pointer;text-align:left;transition:border-color .15s}
.kpi:hover{border-color:var(--line2)}
.kpi.on{border-color:var(--txt);box-shadow:0 0 0 1px var(--txt)}
.kpi .l{font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.kpi .v{font-size:30px;font-weight:700;letter-spacing:-.035em;margin-top:auto;padding-top:8px;line-height:1}
.kpi.alerta .v{color:var(--warn)} .kpi.mal .v{color:var(--bad)}
.item{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px;display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:22px}
@media (max-width:760px){.item{grid-template-columns:minmax(0,1fr)}}
.vid{aspect-ratio:9/16;width:100%;border-radius:16px;overflow:hidden;background:#1d1916;position:relative}
.vid iframe{position:absolute;top:0;left:-6%;width:112%;height:100%;border:0}
.vid .ph{position:absolute;inset:0;display:grid;place-items:center;color:#b5a79f;font-size:13px;text-align:center;padding:20px}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
.pill{display:inline-block;font-size:11.5px;font-weight:500;padding:4px 11px;border-radius:99px;background:var(--soft);color:var(--mut)}
.pill.m{background:var(--txt);color:#fff}
.pill.e-revisar{background:var(--warn-bg);color:var(--warn)}
.pill.e-error,.pill.e-rechazado{background:var(--bad-bg);color:var(--bad)}
.pill.e-subido,.pill.e-aprobado{background:var(--ok-bg);color:var(--ok)}
.links{font-size:12.5px;color:var(--mut);margin-bottom:14px}
.links a{color:var(--txt);font-weight:500}
h3{margin:4px 0 8px;font-size:10.5px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.12em}
.subs{max-height:400px;overflow:auto;border:1px solid var(--line);border-radius:16px;background:var(--card)}
.subs label{display:grid;grid-template-columns:30px minmax(0,1fr);align-items:center;gap:4px;padding:3px 8px;border-top:1px solid var(--line)}
.subs label:first-child{border-top:0}
.subs span{color:var(--mut2);font-size:11.5px;text-align:right;font-variant-numeric:tabular-nums}
.subs input{width:100%;border:1px solid transparent;background:transparent;color:var(--txt);font-size:13.5px;padding:7px 9px;border-radius:10px}
.subs input:focus{outline:none;border-color:var(--line2);background:var(--soft)}
.cambio{background:var(--warn-bg)!important;color:var(--warn)!important}
.nota{width:100%;border:1px solid var(--line);border-radius:14px;padding:11px 13px;font-size:13.5px;background:var(--card);color:var(--txt);resize:vertical}
.nota:focus{outline:none;border-color:var(--line2)}
.chk{display:flex;gap:7px;align-items:center;font-size:12.5px;color:var(--mut);margin-top:9px}
.acciones{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;align-items:center}
.ayuda{font-size:12px;color:var(--mut2);margin-top:8px}
.err{background:var(--bad-bg);color:var(--bad);border-radius:14px;padding:11px 13px;font-size:12.5px;white-space:pre-wrap;margin-bottom:12px}
.hist{font-size:12.5px;color:var(--mut);margin-top:12px;background:var(--soft);border-radius:14px;padding:10px 13px}
.vacio{text-align:center;color:var(--mut);padding:60px 20px;background:var(--card);border:1px dashed var(--line2);border-radius:var(--r)}
#login{max-width:360px;margin:14vh auto;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:28px}
#login h1{font-size:23px}
#login input{width:100%;margin:16px 0 10px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;font-size:15px;background:var(--soft);color:var(--txt)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--txt);color:#fff;padding:11px 18px;border-radius:99px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.on{opacity:1}

.guion{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--card)}
.fila{display:grid;grid-template-columns:150px minmax(0,1fr);border-top:1px solid var(--line)}
.fila:first-child{border-top:0}
.fila .et{font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);padding:10px 12px;background:var(--soft)}
.fila textarea{border:0;resize:vertical;padding:9px 12px;font-size:13.5px;color:var(--txt);background:transparent;min-height:44px;width:100%}
.fila textarea:focus{outline:none;background:var(--soft)}
.fila .tx{padding:9px 12px;font-size:13.5px}
.hook{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px;margin-bottom:8px}
.hook input{width:100%;border:1px solid transparent;background:transparent;font-size:15px;font-weight:600;color:var(--txt);padding:6px 8px;border-radius:10px}
.hook input:focus{outline:none;border-color:var(--line2);background:var(--soft)}
.hook .src{font-size:11.5px;color:var(--mut);padding:0 8px}
.hook .bts{display:flex;gap:6px}
.btn.sm{min-height:34px;padding:6px 12px;font-size:12px}
.tab-b{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:11px}
.cr{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.cr h4{font-size:17px;font-weight:700;letter-spacing:-.02em;text-transform:capitalize}
.bar{display:grid;grid-template-columns:110px minmax(0,1fr) 34px;align-items:center;gap:8px;font-size:12px;color:var(--mut);margin-top:6px}
.bar i{display:block;height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar i b{display:block;height:100%;background:var(--txt);border-radius:99px}
.falta{margin-top:12px;font-size:12.5px;background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:9px 12px}
.falta li{margin-left:16px}
.okc{margin-top:12px;font-size:12.5px;background:var(--ok-bg);color:var(--ok);border-radius:12px;padding:9px 12px}
</style>
</head>
<body>
<div id="login">
  <h1>B-roll + voz en off · Mi Luz</h1>
  <p class="sub">Entrá con tu clave.</p>
  <input id="clave" type="password" placeholder="Clave" autocomplete="current-password">
  <button class="btn dark" id="entrar" style="width:100%">Entrar</button>
  <p id="login-e" class="sub" style="color:var(--bad)"></p>
</div>
<div class="wrap" id="app" hidden>
  <header>
    <div><h1>B-roll + voz en off · Mi Luz</h1><div class="sub" id="resumen">Cargando…</div></div>
    <button class="btn" id="salir">Salir</button>
  </header>
  <div data-carpeta="B-roll"></div><script src="../drive.js"></script>
  <div class="fila-sol"><div class="marcas" id="solapas"></div><button class="especial" id="sol-pedido"><span class="ico">✨</span><span><b>Pedir variantes</b><small>Subí un video y te sacamos versiones</small></span></button></div>
  <div class="top"><div class="hero" id="hero"></div><div class="kpis" id="tabs"></div></div>
  <div id="lista"></div>
</div>
<div class="toast" id="toast"></div>
<script type="module">
const CLAVES = {"miluz-2026":"Luz","cima-2026":"Nacho"};
const $ = s => document.querySelector(s);
const SOLAPAS = [["video","Videos"],["guion","Guiones"],["hook","Hooks"],["banco","Banco de tomas"]];   // "Pedir variantes" va aparte, a la derecha
const ESTADOS = {
  video: [["revisar","Para revisar"],["corregir","Corrigiéndose"],["subido","Listos para subir"],["descartado","Descartados"],["error","Con error"]],
  guion: [["propuesto","Para aprobar"],["armando","Armándose"],["armado","Ya armados"],["corregir","Corrigiéndose"],["descartado","Descartados"]],
  hook:  [["propuesto","Para aprobar"],["aprobado","Aprobados"],["descartado","Descartados"]],
};
const ETQ = {problema:"Problema",intento_fallido:"Lo que probó",rutina:"Rutina",aplicacion:"Aplicación",dias:"Días",resultado:"Resultado",producto:"Producto",estilo_de_vida:"Su vida"};
let quien=null, items={}, solapa="video", filtro={video:"revisar",guion:"propuesto",hook:"propuesto"}, fb=null, pendiente=false;
try { quien = CLAVES[localStorage.getItem("miluz_broll_clave")] || null; solapa = localStorage.getItem("miluz_broll_solapa") || "video"; } catch(e) {}
function toast(t){ const el=$("#toast"); el.textContent=t; el.classList.add("on"); setTimeout(()=>el.classList.remove("on"),2400); }
function esc(s){ return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function entrar(){ const k=$("#clave").value.trim(); if(!CLAVES[k]){ $("#login-e").textContent="Esa clave no es. Probá de nuevo."; return; }
  try{localStorage.setItem("miluz_broll_clave",k)}catch(e){} quien=CLAVES[k]; arrancar(); }
$("#entrar").addEventListener("click", entrar);
$("#clave").addEventListener("keydown", e => { if(e.key==="Enter") entrar(); });
$("#salir").addEventListener("click", () => { try{localStorage.removeItem("miluz_broll_clave")}catch(e){} location.reload(); });

async function arrancar(){
  $("#login").hidden=true; $("#app").hidden=false;
  const [{initializeApp},{getFirestore,collection,doc,onSnapshot,updateDoc,setDoc},{getAuth,signInAnonymously}] = await Promise.all([
    import("https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js"),
    import("https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js"),
    import("https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js")]);
  const app = initializeApp({apiKey:"AIzaSyCTv4DiRCpbCpGYP6E86TPHlkPvaAZTN3g",authDomain:"cleargy-creators.firebaseapp.com",projectId:"cleargy-creators",storageBucket:"cleargy-creators.firebasestorage.app",messagingSenderId:"313543582398",appId:"1:313543582398:web:99fe78991adeea2e7cb4ef"});
  await signInAnonymously(getAuth(app));
  const db = getFirestore(app); fb={db,doc,updateDoc,setDoc};
  onSnapshot(collection(db,"broll_luz"), snap => {
    snap.docChanges().forEach(c => { if(c.type==="removed") delete items[c.doc.id]; else items[c.doc.id]=c.doc.data(); });
    pintar();
  }, err => { $("#resumen").textContent = "No se pudo leer: " + err.message; });
}

const de = t => Object.entries(items).filter(([,it])=>it.tipo===t);
function pintar(){
  const editando = document.activeElement && document.activeElement.closest("#lista input, #lista textarea");
  if(editando || document.querySelector("#lista .cambio")){ pendiente=true; return; } pendiente=false;
  const hora = new Date().toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"});
  $("#resumen").textContent = `Hola ${quien} · actualizado ${hora} · datos en vivo`;
  const pend = {video:de("video").filter(([,i])=>i.estado==="revisar").length, guion:de("guion").filter(([,i])=>i.estado==="propuesto").length, hook:de("hook").filter(([,i])=>i.estado==="propuesto").length};
  $("#solapas").innerHTML = SOLAPAS.map(([k,t])=>`<button class="mt ${k===solapa?"on":""}" data-s="${k}">${t}${pend[k]?`<b>${pend[k]}</b>`:""}</button>`).join("");
  document.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{solapa=b.dataset.s; try{localStorage.setItem("miluz_broll_solapa",solapa)}catch(e){} pintar();});
  $("#sol-pedido").classList.toggle("on", solapa==="pedido");
  $("#sol-pedido").onclick=()=>{solapa="pedido"; try{localStorage.setItem("miluz_broll_solapa",solapa)}catch(e){} pintar();};
  heroYtabs(pend);
  if(solapa==="banco") return pintarBanco();
  if(solapa==="pedido") return pintarPedidos();
  const lista = de(solapa).filter(([,it])=>it.estado===filtro[solapa]).sort((a,b)=>String(a[1].codigo||a[1].n||"").localeCompare(String(b[1].codigo||b[1].n||""),undefined,{numeric:true}));
  // En proceso: guiones aprobados que todavía se están armando (Nacho 11/10: "apruebo y no los veo en ningún lado")
  const proc = de("guion").filter(([,it])=>["aprobado","armando","error"].includes(it.estado))
    .sort((a,b)=>String(a[1].codigo).localeCompare(String(b[1].codigo),undefined,{numeric:true}));
  const franja = (solapa==="video"||solapa==="guion") && proc.length ? `<div class="proceso"><b>⏳ En proceso</b>${proc.map(([,it])=>
    `<span class="pp ${it.estado}">${String(it.codigo).replace("MLZ-P-F26-","")} · ${it.estado==="aprobado"?"en cola":it.estado==="armando"?"armándose (~5 min)":"⚠️ error"}</span>`).join("")}</div>` : "";
  if(!lista.length){ $("#lista").innerHTML = franja + `<div class="vacio">Nada por acá.</div>`; return; }
  $("#lista").innerHTML = franja + lista.map(([id,it]) => solapa==="video"?tVideo(id,it):solapa==="guion"?tGuion(id,it):tHook(id,it)).join("");
  lista.forEach(([id,it]) => conectar(id,it));
}
document.addEventListener("focusout", () => setTimeout(() => { if(pendiente && !document.querySelector("#lista .cambio")) pintar(); }, 250));

function heroYtabs(pend){
  const total = pend.video+pend.guion+pend.hook, R=48, C=2*Math.PI*R;
  const subidos = de("video").filter(([,i])=>i.estado==="subido").length, videos = de("video").length;
  const pct = videos ? Math.round(subidos/videos*100) : 0;
  $("#hero").innerHTML = `<div class="blob"></div>
    <div class="ringbox"><svg width="112" height="112"><circle cx="56" cy="56" r="${R}" stroke="rgba(255,255,255,.14)" stroke-width="9" fill="none"/>
      <circle cx="56" cy="56" r="${R}" stroke="#fff" stroke-width="9" fill="none" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct/100)}"/></svg>
      <div class="mid"><b>${subidos}</b><u>listos para subir</u></div></div>
    <div class="hero-msg"><div class="ey">Bot 4 · videos con tomas reales</div>
      <h3>${total ? `${total} ${total===1?"cosa espera":"cosas esperan"} tu decisión` : "Nada esperando"}</h3>
      <p>${pend.video?`<b>${pend.video} ${pend.video===1?"video":"videos"}</b> para ver. `:""}${pend.guion?`${pend.guion} ${pend.guion===1?"guion":"guiones"} para aprobar antes de armarlos. `:""}${pend.hook?`${pend.hook} hooks para aprobar.`:""}
      Lo aprobado va solo a «✅ Listos para subir».</p></div>`;
  if(solapa==="pedido"){ const ps=de("pedido"); const c=e=>ps.filter(([,i])=>i.estado===e).length;
    $("#tabs").innerHTML = `<div class="kpi"><span class="l">En cola</span><span class="v">${c("pedido")+c("procesando")}</span></div><div class="kpi"><span class="l">Listos</span><span class="v">${c("listo")}</span></div><div class="kpi ${c("error")?"mal":""}"><span class="l">Con error</span><span class="v">${c("error")}</span></div>`; return; }
  if(solapa==="banco"){ const b=(items.banco||{}).creadoras||{}; const n=Object.keys(b).filter(k=>!b[k].general).length;
    $("#tabs").innerHTML = `<div class="kpi"><span class="l">Creadoras con banco</span><span class="v">${n}</span></div><div class="kpi"><span class="l">Tomas en total</span><span class="v">${Object.values(b).reduce((s,x)=>s+(x.total||0),0)}</span></div><div class="kpi"><span class="l">Con historia</span><span class="v">${Object.values(b).filter(x=>x.historia).length}</span></div>`; return; }
  $("#tabs").innerHTML = ESTADOS[solapa].map(([e,t]) => { const c=de(solapa).filter(([,i])=>i.estado===e).length;
    return `<button class="kpi ${e===filtro[solapa]?"on":""} ${(e==="revisar"||e==="propuesto")&&c?"alerta":""} ${e==="error"&&c?"mal":""}" data-e="${e}"><span class="l">${t}</span><span class="v">${c}</span></button>`; }).join("");
  document.querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>{filtro[solapa]=b.dataset.e; pintar();});
}

function tVideo(id,it){
  const vid = it.driveId ? `<iframe src="https://drive.google.com/file/d/${esc(it.driveId)}/preview" allow="autoplay" loading="lazy"></iframe>` : `<div class="ph">El video se está terminando de subir a Drive…</div>`;
  const editable = it.estado==="revisar";
  return `<div class="item" id="it-${esc(id)}"><div class="vid">${vid}</div><div>
    <div class="meta"><span class="pill m">${esc(it.codigo)}</span>${it.creadora?`<span class="pill">${esc(it.creadora)}</span>`:""}<span class="pill">${esc(it.fecha||"")}</span>${it.winner?`<span class="pill">Variante del winner ${esc(String(it.winner).slice(-6))}</span>`:""}</div>
    <h3>${esc(it.titulo||"")}</h3>
    ${it.driveId?`<div class="links"><a href="https://drive.google.com/file/d/${esc(it.driveId)}/view" target="_blank" rel="noopener">Abrir en Drive</a></div>`:""}
    ${it.gate&&!it.error?`<div class="origen-v" style="background:#E8F5EC;color:#1E6B3A;border-color:#BFE3CB">${esc(it.gate)}</div>`:""}
    ${it.error?`<div class="err">${esc(it.error)}</div>`:""}
    ${editable?`<h3 style="margin-top:14px">Qué hay que cambiar</h3>
      <textarea class="nota" rows="3" placeholder="Ej.: más cara de la creadora al principio · seg 13 sacá la toma del frasco · la landing más larga"></textarea>
      <div class="acciones"><button class="btn ok aprobar">Aprobar · va a Listos para subir</button><button class="btn dark corregir" disabled>Pedir cambio</button><button class="btn no descartar">Descartar</button></div>
      <p class="ayuda">El cambio vuelve armado en ~10 min. Aprobar lo mueve a Drive «Mi Luz · Bots / ✅ Listos para subir / hoy / B-roll».</p>`:""}
    ${(it.notas||[]).length?`<div class="hist"><b>Versión ${it.version||1}.</b> Cambios pedidos: ${(it.notas||[]).map(esc).join(" · ")}</div>`:""}
  </div></div>`;
}
function tGuion(id,it){
  const editable = it.estado==="propuesto";
  const filas = (it.filas||[]).map((f,i)=>`<div class="fila"><div class="et">${esc((f.etapa||"").toLowerCase())}</div>${editable?`<textarea data-i="${i}" data-orig="${esc(f.texto)}" rows="2">${esc(f.texto)}</textarea>`:`<div class="tx">${esc(f.texto)}</div>`}</div>`).join("");
  return `<div class="cr" id="it-${esc(id)}" style="margin-bottom:12px">
    <div class="meta"><span class="pill m">${esc(it.codigo)}</span>${it.creadora?`<span class="pill">${esc(it.creadora)}</span>`:""}<span class="pill">${esc(it.palabras||"")} palabras</span>${it.winner?`<span class="pill">Variante del winner ${esc(String(it.winner).slice(-6))}</span>`:""}${it.placa?`<span class="pill">Placa: ${esc(it.placa)}</span>`:""}</div>
    ${it.origen_variantes?`<div class="origen-v">🏆 ${esc(it.origen_variantes)}</div>`:""}
    <h3>${esc(it.titulo||"")}</h3><div class="guion">${filas}</div>
    ${(it.cambios||[]).length?`<div class="hist"><b>Qué corrigió del winner:</b> ${(it.cambios||[]).map(esc).join(" · ")}</div>`:""}
    ${editable?`<h3 style="margin-top:14px">O pedile el cambio con tus palabras</h3>
      <textarea class="nota" rows="2" placeholder="Ej.: el hook más corto · sacá lo de las cuotas · que hable más de la lámpara"></textarea>
      <div class="acciones"><button class="btn ok aprobar">Aprobar y armar el video</button><button class="btn dark corregir" disabled>Corregir</button><button class="btn no descartar">Descartar</button></div>
      <p class="ayuda">Aprobar gasta la voz y el armado (~USD 0,05). Podés editar el texto directo en cada fila.</p>`:""}
    ${(it.notas||[]).length?`<div class="hist">Correcciones: ${(it.notas||[]).map(esc).join(" · ")}</div>`:""}
  </div>`;
}
function tHook(id,it){
  const editable = it.estado==="propuesto";
  return `<div class="hook" id="it-${esc(id)}"><div>${editable?`<input value="${esc(it.texto)}" data-orig="${esc(it.texto)}">`:`<div style="font-weight:600;font-size:15px;padding:6px 8px">${esc(it.texto)}</div>`}<div class="src">${esc(it.fuente||"")}</div></div>
    ${editable?`<div class="bts"><button class="btn ok sm aprobar">Aprobar</button><button class="btn no sm descartar">Descartar</button></div>`:`<span class="pill">${esc(it.estado)}</span>`}</div>`;
}
function pintarBanco(){
  const b = (items.banco||{}).creadoras || {};
  const ks = Object.keys(b).sort((x,y)=>(b[y].total||0)-(b[x].total||0));
  if(!ks.length){ $("#lista").innerHTML = `<div class="vacio">Todavía no hay banco.</div>`; return; }
  $("#lista").innerHTML = `<div class="tab-b">` + ks.map(k => { const c=b[k], mx=Math.max(1,...Object.values(c.etapas||{}));
    return `<div class="cr"><h4>${k==="_general"?"Problema general":esc(k)}</h4><div class="sub">${c.total} tomas · su cara en ${c.caras} videos · ${c.danada} de uñas dañadas${c.historia?" · tiene historia":""}</div>
      ${Object.entries(c.etapas||{}).map(([e,n])=>`<div class="bar"><span>${ETQ[e]||e}</span><i><b style="width:${Math.round(n/mx*100)}%"></b></i><span>${n}</span></div>`).join("")}
      ${c.general?`<div class="okc">Uñas dañadas de otras personas: solo para frases generales.</div>`:(c.faltan||[]).length?`<div class="falta"><b>Falta grabar:</b><ul>${c.faltan.map(f=>`<li>${esc(f)}</li>`).join("")}</ul></div>`:`<div class="okc">Banco completo ✅</div>`}
    </div>`; }).join("") + `</div><p class="ayuda" style="margin-top:14px">Los códigos (P04, K01…) son de la lista de tomas que tienen las creadoras.</p>`;
}

function pintarPedidos(){
  const b=(items.banco||{}).creadoras||{};
  const cr=Object.keys(b).filter(k=>!b[k].general && (b[k].caras||0)>=4).sort();
  const ps=de("pedido").sort((x,y)=>String(y[1].creado||"").localeCompare(String(x[1].creado||"")));
  const est={pedido:"En cola",procesando:"Armando las variantes…",listo:"Listo · están en Guiones",error:"Con error"};
  $("#lista").innerHTML = `<div class="cr" style="margin-bottom:14px">
    <h3>Cargá un video y te saco variantes</h3>
    <p class="sub" style="margin-bottom:10px">Pegá el link: Drive (con acceso "cualquiera con el link"), Instagram, TikTok o la Biblioteca de Anuncios. El bot lo desarma y arma variantes con el mismo hook y la misma estructura, con las tomas de la creadora que elijas. Te aparecen en <b>Guiones</b> para aprobar antes de gastar en voz.</p>
    <input id="p-link" class="nota" placeholder="https://drive.google.com/file/d/… o el link del reel" style="margin-bottom:8px">
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <select id="p-cant" class="btn">${[1,2,3].map(n=>`<option value="${n}">${n} ${n===1?"variante":"variantes"}</option>`).join("")}</select>
      <select id="p-cr" class="btn">${(cr.length?cr:["vane"]).map(k=>`<option value="${esc(k)}" ${k==="vane"?"selected":""}>con tomas de ${esc(k)}</option>`).join("")}</select>
      <button class="btn dark" id="p-ok">Pedir variantes</button>
    </div>
    <textarea id="p-nota" class="nota" rows="2" placeholder="Opcional: qué querés distinto (ej.: más corto, otro hook, para mujeres de 50)" style="margin-top:8px"></textarea>
  </div>` + (ps.length ? ps.map(([id,it])=>`<div class="hook"><div><div style="font-weight:600;font-size:13.5px;padding:2px 8px;word-break:break-all">${esc(it.link)}</div>
      <div class="src">${esc(it.cantidad)} · ${esc(it.creadora)} · ${esc((it.creado||"").slice(0,16).replace("T"," "))}${it.nota?" · "+esc(it.nota):""}${(it.guiones||[]).length?" · "+it.guiones.map(esc).join(", "):""}${it.error?" · "+esc(it.error):""}</div></div>
      <span class="pill ${it.estado==="listo"?"e-aprobado":it.estado==="error"?"e-error":"e-revisar"}">${esc(est[it.estado]||it.estado)}</span></div>`).join("") : "");
  $("#p-ok").onclick = async () => {
    const link=$("#p-link").value.trim(); if(!/^https?:\/\//.test(link)){ toast("Pegá un link"); return; }
    const id="pedido_"+Date.now();
    try { await fb.setDoc(fb.doc(fb.db,"broll_luz",id),{tipo:"pedido",estado:"pedido",link,cantidad:+$("#p-cant").value,creadora:$("#p-cr").value,nota:$("#p-nota").value.trim(),pedidoPor:quien,creado:new Date().toISOString()});
      toast("Pedido: en ~15 min te aparecen en Guiones"); $("#p-link").value=""; $("#p-nota").value=""; } catch(e){ toast("No se pudo: "+e.message); }
  };
}

function conectar(id,it){
  const el = document.getElementById("it-"+id); if(!el) return;
  const ref = fb.doc(fb.db,"broll_luz",id);
  const corr = el.querySelector(".corregir"), nt = el.querySelector(".nota");
  const hayCambios = () => [...el.querySelectorAll("textarea[data-i], input[data-orig]")].some(i=>i.value!==i.dataset.orig) || (nt && nt.value.trim());
  el.querySelectorAll("textarea[data-i], input[data-orig], .nota").forEach(i => i.addEventListener("input", () => {
    i.classList.toggle("cambio", i.classList.contains("nota") ? !!i.value.trim() : i.value!==i.dataset.orig); if(corr) corr.disabled = !hayCambios(); }));
  const marcar = async (datos,msg) => { try { await fb.updateDoc(ref,{...datos,revisadoPor:quien,actualizado:new Date().toISOString()}); toast(msg);
      el.querySelectorAll(".cambio").forEach(i=>i.classList.remove("cambio")); document.activeElement?.blur(); pintar(); } catch(e){ toast("No se pudo guardar: "+e.message); } };
  if(it.tipo==="hook"){
    el.querySelector(".aprobar")?.addEventListener("click", () => { const inp=el.querySelector("input"); marcar({estado:"aprobado", texto: inp?inp.value.trim():it.texto}, "Hook aprobado"); });
    el.querySelector(".descartar")?.addEventListener("click", () => marcar({estado:"descartado"}, "Descartado"));
    return;
  }
  el.querySelector(".aprobar")?.addEventListener("click", () => it.tipo==="video" ? marcar({estado:"aprobado"}, "Aprobado: se mueve a Listos para subir") : marcar({estado:"aprobado"}, "Aprobado: se arma el video"));
  corr?.addEventListener("click", () => {
    const ed = [...el.querySelectorAll("textarea[data-i]")].map(i=>i.value);
    const cambioTexto = ed.some((v,i)=>v!==(it.filas||[])[i]?.texto);
    marcar({estado:"corregir", nota:(nt?nt.value.trim():""), ...(cambioTexto?{filasEditadas:ed}:{})}, it.tipo==="video"?"Listo: vuelve corregido en ~10 min":"Listo: se corrige el guion");
  });
  el.querySelector(".descartar")?.addEventListener("click", () => { if(confirm("¿Descartar?")) marcar({estado:"descartado"}, "Descartado"); });
}
if(quien) arrancar();
</script>
</body>
</html>
